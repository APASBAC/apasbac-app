name: apasbac_app
description: App da APASBAC — Associação de Proteção aos Animais Socorro Bicho Assis Chateaubriand
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Navigation
  go_router: ^13.2.0
  # HTTP
  dio: ^5.4.3
  # Secure storage (tokens)
  flutter_secure_storage: ^9.0.0
  # Image/video picker
  image_picker: ^1.1.2
  # Video player (preview)
  video_player: ^2.8.6
  # Cached images
  cached_network_image: ^3.3.1
  # Date formatting
  intl: ^0.19.0
  # Icons
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
